# Common plugin names are bundled with Oh My Zsh.
[terminal]
builtinPlugins = ["git", "extract", "sudo", "vscode", "colored-man-pages", "fzf", "zoxide"]
macosPlugins = ["brew", "macos"]
ohMyZshCommit = "2100c630ba4bd67bb48802c3e7da893a4fdaa1a0"

# Keep syntax highlighting last. Register both the name and source of new plugins.
[[terminal.externalPlugins]]
name = "zsh-autosuggestions"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
commit = "85919cd1ffa7d2d5412f6d3fe437ebdbeeec4fc5"

[[terminal.externalPlugins]]
name = "zsh-syntax-highlighting"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
commit = "2fc57d63067c18b1100ecdbf684fa5baf49459d1"

